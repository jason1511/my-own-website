name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find functions js -type f -name '*.js' -print0)

      - name: Validate fresh D1 schema
        shell: bash
        run: |
          sqlite3 /tmp/portfolio-schema.db < schema.sql
          sqlite3 /tmp/portfolio-schema.db "PRAGMA integrity_check;"
